name: Create release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Type of release to build: patch, minor, major, or custom"
        options:
          - patch
          - minor
          - major
          - custom
        default: patch
        type: choice
        required: true
      custom_version:
        description: "Version to release (only used when release_type is 'custom', e.g. 1.2.3)"
        type: string
        required: false
        default: ""
      default_branch:
        description: "Branch to release from and push commits/tags back to"
        type: string
        required: false
        default: "develop"
      readme_filename:
        description: "README filename regenerated by ansible-docsmith (case-sensitive)"
        type: string
        required: false
        default: "README.md"
      draft_release:
        description: "Create the GitHub release as a draft"
        type: boolean
        required: false
        default: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.CI_CLIENT_ID }}
          private-key: ${{ secrets.CI_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.default_branch }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Configure Git author
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>'
      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish npm package
        run: |
          npm ci
          npm run build  
          npm publish

      - name: Determine release version
        id: version
        run: |
          currentVersion=$(jq -r '.version' package.json)

          case "${{ inputs.release_type }}" in
            custom)
              releaseVersion="${{ inputs.custom_version }}"
              if [ -z "$releaseVersion" ]; then
                echo "custom_version is required when release_type is 'custom'" >&2
                exit 1
              fi
              ;;
            major|minor|patch)
              IFS='.' read -r major minor patch <<< "$currentVersion"
              case "${{ inputs.release_type }}" in
                major) major=$((major + 1)); minor=0; patch=0 ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                patch) patch=$((patch + 1)) ;;
              esac
              releaseVersion="${major}.${minor}.${patch}"
              ;;
            *)
              echo "Unknown release_type '${{ inputs.release_type }}'" >&2
              exit 1
              ;;
          esac

          echo "Releasing version $releaseVersion (current: $currentVersion)"
          echo "release_version=$releaseVersion" >> "$GITHUB_OUTPUT"

      - name: Bump version
        run: |
          jq '.version = "${{ steps.version.outputs.release_version }}"' package.json > package.json.new
          mv package.json.new package.json
          git add package.json
          git commit -m "Release ${{ steps.version.outputs.release_version }}"

      - name: Update changelog
        run: |
          pip install git-cliff

          git-cliff --config cliff.toml --tag "v${{ steps.version.outputs.release_version }}" --unreleased --prepend CHANGELOG.md
          git-cliff --config cliff.toml --tag "v${{ steps.version.outputs.release_version }}" --latest --strip header > RELEASE_NOTES.md

          git add CHANGELOG.md
          git commit -m "chore: Changelog for Release ${{ steps.version.outputs.release_version }}"

      - name: Push
        run: git push origin ${{ inputs.default_branch }}

      - name: Create Release on GH
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "v${{ steps.version.outputs.release_version }}" \
            ${{ inputs.draft_release && '--draft' || '' }} \
            --title "${{ steps.version.outputs.release_version }}" \
            --notes-file RELEASE_NOTES.md
