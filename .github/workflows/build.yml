name: CI

on: [push]

jobs:
  build:
    name: Test on node ${{ matrix.node_version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node_version: [22, 24]
        # Windows (windows-latest) doesn't work with karma
        os: [ubuntu-latest, macOS-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}

      - name: npm install, build and test
        run: |
          npm install
          npm run build:all
          npm run test

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
        contents: write
        packages: write
        attestations: write
        id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: publish release package
        run: |
          echo "//registry.npmjs.org/:_authToken=$NODE_AUTH_TOKEN" >> ~/.npmrc
          npm i
          npm run build && cd dist
          npm publish
        if: contains( github.ref, 'main' ) || contains( github.base_ref, 'main' )

      - name: publish preview package
        run: |
          echo "//registry.npmjs.org/:_authToken=$NODE_AUTH_TOKEN" >> ~/.npmrc
          PACKAGE_VERSION=$(node -p -e "require('./package.json').version")
          CURRENT_TIME=$(date +%s)
          NEW_VERSION=${PACKAGE_VERSION}-build${CURRENT_TIME}
          npm i
          npm version $NEW_VERSION --no-git-tag-version
          npm run build && cd dist
          npm publish  --tag next
        if: contains( github.ref, 'develop' ) || contains( github.base_ref, 'develop' )
